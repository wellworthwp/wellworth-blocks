# wellworth-blocks — CI (PLAN T006 §B; SPECS §19, §20).
#
# Today this repo holds the plugin header scaffold (wellworth-blocks.php)
# only — no block code yet. So:
#   - PHP tri-matrix runs `php -l` + PHPCS on every .php file. Catches
#     real bugs immediately: any new PHP file lands fully linted.
#   - JS/TS/Vitest/a11y/lighthouse jobs activate once T038 lands the
#     plugin's package.json + block sources.
#
# Floor: PHP 8.1 (runtime floor — RULES §5 / SPECS §6.1); dev floor 8.3;
# tested against latest. A regression on any leg fails the PR — that's
# what catches "this uses an 8.3-only feature" before it breaks a
# customer on a shared-host PHP 8.1 install.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect surfaces
    runs-on: ubuntu-latest
    outputs:
      has_php: ${{ steps.find.outputs.has_php }}
      has_js: ${{ steps.find.outputs.has_js }}
      has_ts: ${{ steps.find.outputs.has_ts }}
      has_phpunit: ${{ steps.find.outputs.has_phpunit }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        shell: bash
        run: |
          has_php=$(find . -maxdepth 4 -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' | head -1 | grep -q . && echo true || echo false)
          has_js=$([ -f package.json ] && echo true || echo false)
          has_ts=$([ -f tsconfig.json ] && echo true || echo false)
          has_phpunit=$([ -f phpunit.xml.dist ] || [ -f phpunit.xml ] && echo true || echo false)
          {
            echo "has_php=$has_php"
            echo "has_js=$has_js"
            echo "has_ts=$has_ts"
            echo "has_phpunit=$has_phpunit"
          } >> "$GITHUB_OUTPUT"

  php:
    name: PHP ${{ matrix.php }} — lint + PHPCS
    needs: detect
    if: needs.detect.outputs.has_php == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tri-matrix per PLAN T006: 8.1 runtime floor, 8.3 dev floor,
        # latest. Floor break = customer break.
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr
          coverage: none
      - name: php -l (syntax check)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null 2>&1 || { echo "::error file=$f::php -l failed on $f"; fail=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*')
          exit "$fail"
      - name: Install PHPCS toolchain (composer, isolated)
        working-directory: ${{ runner.temp }}
        run: |
          cat > composer.json <<'JSON'
          {
            "name": "wellworthwp/phpcs-toolchain",
            "require": {
              "squizlabs/php_codesniffer": "^3.10",
              "wp-coding-standards/wpcs": "^3.1",
              "phpcsstandards/phpcsextra": "^1.2",
              "phpcompatibility/phpcompatibility-wp": "^2.1",
              "dealerdirect/phpcodesniffer-composer-installer": "^1.0"
            },
            "config": { "allow-plugins": { "dealerdirect/phpcodesniffer-composer-installer": true } }
          }
          JSON
          composer install --no-interaction --no-progress --quiet
          ./vendor/bin/phpcs -i
      - name: PHPCS
        env:
          PHPCS_BIN: ${{ runner.temp }}/vendor/bin/phpcs
        run: |
          if [ -f .phpcs.xml.dist ] || [ -f phpcs.xml ] || [ -f phpcs.xml.dist ]; then
            "$PHPCS_BIN" --report=full --report-summary --report-checkstyle=phpcs-report.xml || (cs2pr < phpcs-report.xml; exit 1)
          else
            # Until .phpcs.xml.dist lands (T038), enforce a sane baseline.
            "$PHPCS_BIN" \
              --standard=WordPress-Extra,PHPCompatibilityWP \
              --runtime-set testVersion ${{ matrix.php }}- \
              --extensions=php \
              --ignore='vendor/*,node_modules/*' \
              .
          fi

  psalm:
    name: Psalm (strict static analysis)
    needs: detect
    if: needs.detect.outputs.has_php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: detect
        shell: bash
        run: |
          if [ -f psalm.xml ] || [ -f psalm.xml.dist ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No psalm config yet - Psalm activates when T038 lands strict types (RULES Sec5)."
          fi
      - if: steps.detect.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - if: steps.detect.outputs.run == 'true'
        run: composer install --no-interaction --no-progress --quiet
      - if: steps.detect.outputs.run == 'true'
        run: ./vendor/bin/psalm --output-format=github --no-progress

  phpunit:
    name: PHPUnit ${{ matrix.php }}
    needs: detect
    if: needs.detect.outputs.has_phpunit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug
      - run: composer install --no-interaction --no-progress --quiet
      - run: ./vendor/bin/phpunit --colors=never

  js-matrix:
    name: JS/TS — Node ${{ matrix.node }} · pnpm ${{ matrix.pnpm }}
    needs: detect
    if: needs.detect.outputs.has_js == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        pnpm: ['9', '11']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present lint
      - if: needs.detect.outputs.has_ts == 'true'
        run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      - run: pnpm run --if-present build
